{% extends 'base.html' %}

{% block head %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
 <link rel="stylesheet" href="{{ url_for('static', filename='css/calcStyle.css') }}">
{% endblock %}

{% block body %}
<ul>
    <li><a href="/" title="Home Section">Home</a></li>
    <li><a href="/calc" title="Calculator Section">Calculator</a></li>
    <li><a href="/about" title="About Section">About</a></li>
    <li><a href="/calcDE" title="German">German</a></li>
</ul>
<div class="title">Inflation Calculator</div>
<form id="form" oninput="save()">
<label for="inValue">€ amount in {{ baseYear }}</label>
<input type="number" min="1" name="inValue" id="inValue" data-factor="{{ priceFactor }}">
</form>
<div><span id="inputVar"></span> € in {{ baseYear }} is <span id="outputVar"></span>€ in {{ latestYear }}</div>
<div>This is a loss of {{ purchasingLoss }}% of purchasing power in {{ yearSpan }} years</div>
{% endblock %}
